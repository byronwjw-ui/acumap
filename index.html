function renderSearch(q){

  if(query){

    POINTS.forEach(p=>{ if([p.name,p.pinyin,p.code,p.summary,p.region,...(p.tags||[])].some(match)) results.push({type:'穴位',title:`${p.name} ${p.code}`,desc:p.summary,href:`#/points/${p.slug}`}); });
    CONDITIONS.forEach(c=>{ if([c.title,c.shortTitle,c.summary,c.intro,...(c.tags||[])].some(match)) results.push({type:'常见不适',title:c.shortTitle,desc:c.summary,href:`#/conditions/${c.slug}`}); });
    MERIDIANS.forEach(m=>{ if([m.name,m.english,m.summary,...(m.themes||[])].some(match)) results.push({type:'经络',title:m.name,desc:m.summary,href:`#/meridians/${m.slug}`}); });
  }
  return `<div class="container">
    <div class="breadcrumb"><a href="#/">首页</a> / 搜索</div>
    <div class="section-head">
      <div class="eyebrow">SEARCH</div>
      <h2>搜索结果${query?`："${escape(query)}"`:''}</h2>
    </div>
    <form class="search" onsubmit="event.preventDefault();const q=this.q.value.trim();location.hash='#/search?q='+encodeURIComponent(q);" style="margin-bottom:18px">

      <button type="submit">搜索</button>

  </div>`;
}

function notFound(){
  return `<div class="container"><div class="empty" style="margin:60px 0">没有找到该内容。<br/><a class="btn outline" style="margin-top:16px" href="#/">返回首页</a></div></div>`;
}

/* ========== 路由 ========== */
function parseHash(){
  let h = location.hash.replace(/^#/,'');
  if(!h || h==='/') return {path:'/',params:{}};
  const [path,query] = h.split('?');
  const params = {};
  if(query) query.split('&').forEach(kv=>{const [k,v]=kv.split('=');params[decodeURIComponent(k)]=decodeURIComponent(v||'')});
  return {path,params};
}

function route(){
  const {path,params} = parseHash();
  const app = document.getElementById('app');
  let html = '';
  if(path==='/' ) html = renderHome();
  else if(path==='/conditions') html = renderConditions();
  else if(path.startsWith('/conditions/')) html = renderConditionDetail(path.split('/')[2]);
  else if(path==='/points') html = renderPoints();
  else if(path.startsWith('/points/')) html = renderPointDetail(path.split('/')[2]);
  else if(path==='/meridians') html = renderMeridians();
  else if(path.startsWith('/meridians/')) html = renderMeridianDetail(path.split('/')[2]);
  else if(path==='/acupressure-guide') html = renderGuide();
  else if(path==='/safety') html = renderSafety();
  else if(path==='/disclaimer') html = renderDisclaimer();
  else if(path==='/search') html = renderSearch(params.q);
  else html = notFound();
  app.innerHTML = html;
  window.scrollTo({top:0,behavior:'instant'});

  // 高亮导航
  document.querySelectorAll('#navList a').forEach(a=>{
    const r = a.getAttribute('data-route');
    a.classList.toggle('active', r==='/' ? path==='/' : path.startsWith(r));
  });

  // 穴位筛选交互
  const filter = document.getElementById('pointFilter');
  if(filter){
    filter.addEventListener('input',()=>{
      const q = filter.value.trim().toLowerCase();
      const grid = document.getElementById('pointsGrid');
      const filtered = q ? POINTS.filter(p=>[p.name,p.pinyin,p.code,p.region,p.summary,...(p.tags||[])].some(t=>String(t).toLowerCase().includes(q))) : POINTS;
      grid.innerHTML = filtered.length ? filtered.map(pointCard).join('') : `<div class="empty" style="grid-column:1/-1">没有匹配的穴位。</div>`;
    });
  }
}

window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('year').textContent = new Date().getFullYear();
  if(!location.hash) location.hash = '#/';
  route();
});
</script>
</body>
</html>

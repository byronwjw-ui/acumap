function esc(s){

  return String(s).replace(/[&<>"']/g,function(c){

  });
}

/* ===== 路由 ===== */
function parseHash(){
  var h=window.location.hash||'';
  if(h.charAt(0)==='#')h=h.substring(1);
  if(!h||h==='/')return {path:'/',params:{}};
  if(h.charAt(0)!=='/')h='/'+h;
  var qIdx=h.indexOf('?');
  var path=qIdx>=0?h.substring(0,qIdx):h;
  var qs=qIdx>=0?h.substring(qIdx+1):'';
  var params={};
  if(qs){
    var pairs=qs.split('&');
    for(var i=0;i<pairs.length;i++){
      var p=pairs[i];
      var eq=p.indexOf('=');
      var key=decodeURIComponent(eq>=0?p.substring(0,eq):p);
      var val=eq>=0?decodeURIComponent(p.substring(eq+1)):'';
      params[key]=val;
    }
  }
  return {path:path,params:params};
}

function resolveView(){
  var r=parseHash();
  var path=r.path;
  var parts=[];
  var segs=path.split('/');
  for(var i=0;i<segs.length;i++){if(segs[i])parts.push(segs[i]);}
  var top=parts[0]||'';
  var sub=parts[1]||'';
  if(!top)return viewHome();
  if(top==='conditions')return sub?viewConditionDetail(sub):viewConditions();
  if(top==='points')return sub?viewPointDetail(sub):viewPoints();
  if(top==='meridians')return sub?viewMeridianDetail(sub):viewMeridians();
  if(top==='acupressure-guide')return viewGuide();
  if(top==='safety')return viewSafety();
  if(top==='disclaimer')return viewDisclaimer();
  if(top==='search')return viewSearch(r.params.q);
  return viewNotFound('未知路径：'+path);
}

function highlightNav(){
  var r=parseHash();
  var path=r.path;
  var links=document.querySelectorAll('#navList a');
  for(var i=0;i<links.length;i++){
    var route=links[i].getAttribute('data-route');
    var active=route==='/'?path==='/':path.indexOf(route)===0;
    if(active){links[i].className='active';}else{links[i].className='';}
  }
}

function attachHandlers(){
  var hs=document.getElementById('homeSearch');
  if(hs){
    hs.onsubmit=function(e){
      if(e&&e.preventDefault)e.preventDefault();
      var q=hs.q.value.replace(/^\s+|\s+$/g,'');
      if(q)window.location.hash='#/search?q='+encodeURIComponent(q);
      return false;
    };
  }
  var sf=document.getElementById('searchForm');
  if(sf){
    sf.onsubmit=function(e){
      if(e&&e.preventDefault)e.preventDefault();
      var q=sf.q.value.replace(/^\s+|\s+$/g,'');
      window.location.hash='#/search?q='+encodeURIComponent(q);
      return false;
    };
  }
  var pf=document.getElementById('pointFilter');
  if(pf){
    pf.oninput=function(){
      var q=pf.value.replace(/^\s+|\s+$/g,'').toLowerCase();
      var grid=document.getElementById('pointsGrid');
      if(!grid)return;
      var html='';
      var count=0;
      for(var i=0;i<POINTS.length;i++){
        var p=POINTS[i];
        if(!q){html+=pointCard(p);count++;continue;}
        var hay=[p.name,p.pinyin,p.code,p.region,p.summary].concat(p.tags||[]).join('|').toLowerCase();
        if(hay.indexOf(q)>=0){html+=pointCard(p);count++;}
      }
      grid.innerHTML=count?html:'<div class="empty" style="grid-column:1/-1">没有匹配的穴位。</div>';
    };
  }
}

function render(){
  var app=document.getElementById('app');
  if(!app)return;
  var html='';
  try{html=resolveView();}
  catch(err){
    var bar=document.getElementById('errbar');
    if(bar){bar.style.display='block';bar.textContent='渲染错误: '+(err&&err.message||err);}
    html='<div class="container"><div class="empty" style="margin:60px 0;color:#7a1f1f">页面渲染出错：'+esc(err&&err.message||err)+'<br/><a href="#/" class="btn outline" style="margin-top:16px;display:inline-block">返回首页</a></div></div>';
  }
  if(!html||typeof html!=='string'){
    html='<div class="container"><div class="empty" style="margin:60px 0">页面内容为空。<a href="#/">返回首页</a></div></div>';
  }
  app.innerHTML=html;
  try{window.scrollTo(0,0);}catch(_){}
  try{highlightNav();}catch(_){}
  try{attachHandlers();}catch(_){}
}

/* ===== 启动 ===== */
function boot(){
  var y=document.getElementById('year');
  if(y)y.textContent=String(new Date().getFullYear());
  if(!window.location.hash){
    try{window.location.hash='#/';}catch(_){}
  }
  if(window.addEventListener){
    window.addEventListener('hashchange',render,false);
  }else if(window.attachEvent){
    window.attachEvent('onhashchange',render);
  }
  render();
}

// 立即启动；脚本放页面底部，DOM 已就绪
try{boot();}catch(err){
  var bar=document.getElementById('errbar');
  if(bar){bar.style.display='block';bar.textContent='启动错误: '+(err&&err.message||err)+(err&&err.stack?'\n'+err.stack:'');}
}

})();

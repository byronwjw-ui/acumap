/* ===== 路由 ===== */
function parseHash(){
  var h=location.hash||'';
  if(h.charAt(0)==='#')h=h.slice(1);
  if(!h||h==='/')return {path:'/',params:{}};
  var qIdx=h.indexOf('?');
  var path=qIdx>=0?h.slice(0,qIdx):h;
  var qs=qIdx>=0?h.slice(qIdx+1):'';
  var params={};
  if(qs){
    qs.split('&').forEach(function(pair){
      var i=pair.indexOf('=');
      var k=decodeURIComponent(i>=0?pair.slice(0,i):pair);
      var v=i>=0?decodeURIComponent(pair.slice(i+1)):'';
      params[k]=v;
    });
  }
  if(path.charAt(0)!=='/')path='/'+path;
  return {path:path,params:params};
}

function resolveView(){
  var r=parseHash();
  var path=r.path;
  var params=r.params;
  var parts=path.split('/').filter(Boolean);
  var top=parts[0]||'';
  var sub=parts[1]||'';
  if(!top)return viewHome();
  if(top==='conditions')return sub?viewConditionDetail(sub):viewConditions();
  if(top==='points')return sub?viewPointDetail(sub):viewPoints();
  if(top==='meridians')return sub?viewMeridianDetail(sub):viewMeridians();
  if(top==='acupressure-guide')return viewGuide();
  if(top==='safety')return viewSafety();
  if(top==='disclaimer')return viewDisclaimer();
  if(top==='search')return viewSearch(params.q);
  return viewNotFound();
}

function highlightNav(){
  var r=parseHash();
  var path=r.path;
  var links=document.querySelectorAll('#navList a');
  for(var i=0;i<links.length;i++){
    var route=links[i].getAttribute('data-route');
    var active=route==='/'?path==='/':path.indexOf(route)===0;
    if(active)links[i].classList.add('active');else links[i].classList.remove('active');
  }
}

function attachPageHandlers(){
  var hs=document.getElementById('homeSearch');
  if(hs){
    hs.addEventListener('submit',function(e){
      e.preventDefault();
      var q=hs.q.value.trim();
      if(q)location.hash='#/search?q='+encodeURIComponent(q);
    });
  }
  var sf=document.getElementById('searchForm');
  if(sf){
    sf.addEventListener('submit',function(e){
      e.preventDefault();
      var q=sf.q.value.trim();
      location.hash='#/search?q='+encodeURIComponent(q);
    });
  }
  var pf=document.getElementById('pointFilter');
  if(pf){
    pf.addEventListener('input',function(){
      var q=pf.value.trim().toLowerCase();
      var grid=document.getElementById('pointsGrid');
      if(!grid)return;
      var list=q?POINTS.filter(function(p){
        var hay=[p.name,p.pinyin,p.code,p.region,p.summary].concat(p.tags||[]);
        return hay.some(function(t){return String(t).toLowerCase().indexOf(q)>=0});
      }):POINTS;
      grid.innerHTML=list.length?list.map(pointCard).join(''):'<div class="empty" style="grid-column:1/-1">没有匹配的穴位。</div>';
    });
  }
}

function render(){
  var app=document.getElementById('app');
  if(!app)return;
  var html;
  try{
    html=resolveView();
  }catch(err){
    html='<div class="container"><div class="errbox"><strong>渲染错误：</strong>\n'+esc(err&&err.message||err)+'\n\n'+esc(err&&err.stack||'')+'</div></div>';
  }
  app.innerHTML=html;
  try{window.scrollTo(0,0)}catch(_){}
  try{highlightNav()}catch(_){}
  try{attachPageHandlers()}catch(_){}
}

/* ===== 启动 ===== */
function boot(){
  var y=document.getElementById('year');
  if(y)y.textContent=String(new Date().getFullYear());

  // 全局点击委托：所有 #/ 开头的链接都改 hash（防止 file:// 下的怪异行为）
  document.addEventListener('click',function(e){
    var a=e.target;
    while(a&&a!==document){
      if(a.tagName==='A'){
        var href=a.getAttribute('href')||'';
        if(href.charAt(0)==='#'){
          // 让浏览器走原生 hash 流程即可；不阻止默认
        }
        break;
      }
      a=a.parentNode;
    }
  },false);

  window.addEventListener('hashchange',render);
  if(!location.hash)location.hash='#/';
  render();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}

})();
</script>
